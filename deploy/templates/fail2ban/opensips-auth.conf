# Ownswitch — SIP auth failures + unauthorized probes (OpenSIPS xlog + auth.log).
# Matches, for example:
#   REGISTER auth failed user=1001 realm=voip.example.com from=1.2.3.4
#   INVITE auth failed user=1001 from=1.2.3.4
#   INVITE unauthorized from=1.2.3.4
#   ownswitch-sip: REGISTER auth failed user=1001 from=1.2.3.4
# Do not match normal "www_challenge" / first 401 traffic as a ban.
[Definition]
failregex = ^\s*(?:\S+\s+)*(?:WARNING|WARN|ERR|ERROR|NOTICE|INFO)?:?\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
            ^\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\b(?:from|src)=<HOST>\b
            ^\s*.*\b(?:INVITE|REGISTER)\s+unauthorized\b.*\b(?:from|src)=<HOST>\b
            ^\s*.*ownswitch-sip(?:\[\d+\])?:?\s*(?:REGISTER|INVITE)\s+(?:auth failed|unauthorized)\b.*\bfrom=<HOST>\b
ignoreregex = SIP auth challenge|www_challenge
datepattern = {^LN-BEG}
